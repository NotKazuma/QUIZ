<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f766e">
  <title>Kuiz UPKK & SDEA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
        </span>
        Kuiz UPKK & SDEA
      </span>
    </div>
  </header>

  <main class="container">

    <!-- Halaman Utama -->
    <section id="screen-home" class="screen">
      <div class="hero">
        <p class="eyebrow">Assalamualaikum!</p>
        <h1>Jom ulang kaji</h1>
        <p class="muted">Pilih peperiksaan untuk mula berlatih.</p>
      </div>
      <div id="exam-list" class="card-list"></div>
      <button class="card card-button" disabled>
        <span class="card-icon icon-muted" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        </span>
        <span class="card-text">
          <span class="card-title">Kemajuan</span>
          <span class="card-desc">Lihat markah dan topik lemah</span>
        </span>
        <span class="badge badge-outline">Akan datang</span>
      </button>
    </section>

    <!-- Pilih Mod -->
    <section id="screen-mode" class="screen" hidden>
      <button class="btn btn-ghost btn-back" data-back="screen-home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Kembali
      </button>
      <div class="page-head">
        <span id="mode-badge" class="badge"></span>
        <h2>Pilih mod</h2>
      </div>
      <div class="card-list">
        <button id="btn-practice" class="card card-button">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>
          </span>
          <span class="card-text">
            <span class="card-title">Latihan</span>
            <span class="card-desc">Jawab soalan dan terus lihat jawapan betul</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="card card-button" disabled>
          <span class="card-icon icon-muted" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg>
          </span>
          <span class="card-text">
            <span class="card-title">Ujian Bermasa</span>
            <span class="card-desc">Seperti peperiksaan sebenar</span>
          </span>
          <span class="badge badge-outline">Akan datang</span>
        </button>
      </div>
    </section>

    <!-- Pilih Subjek -->
    <section id="screen-subject" class="screen" hidden>
      <button class="btn btn-ghost btn-back" data-back="screen-mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Kembali
      </button>
      <div class="page-head">
        <span id="subject-badge" class="badge"></span>
        <h2>Pilih subjek</h2>
      </div>
      <div id="subject-list" class="card-list"></div>
    </section>

    <!-- Pilih Tahun -->
    <section id="screen-topic" class="screen" hidden>
      <button class="btn btn-ghost btn-back" data-back="screen-subject">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Kembali
      </button>
      <div class="page-head">
        <span id="topic-title" class="badge"></span>
        <h2>Pilih tahun</h2>
      </div>
      <p id="topic-message" class="alert" hidden></p>
      <div id="topic-list" class="card-list"></div>
    </section>

    <!-- Skrin Kuiz -->
    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-header">
        <button class="btn btn-ghost btn-icon" id="btn-quit" aria-label="Berhenti">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div class="progress" role="progressbar" aria-label="Kemajuan kuiz">
          <div id="quiz-progress" class="progress-bar"></div>
        </div>
        <span id="quiz-counter" class="badge badge-secondary"></span>
      </div>

      <div class="card question-card">
        <p id="quiz-subject" class="eyebrow"></p>
        <div id="quiz-question" class="question"></div>
        <img id="quiz-image" class="question-image" alt="Gambar soalan" hidden>
      </div>

      <div id="quiz-options" class="options"></div>
      <div id="quiz-feedback" class="feedback" hidden></div>

      <div class="sticky-action">
        <button id="btn-next" class="btn btn-primary btn-lg" hidden>Seterusnya</button>
      </div>
    </section>

    <!-- Selesai -->
    <section id="screen-done" class="screen" hidden>
      <div class="card result-card">
        <div id="done-emoji" class="result-emoji" aria-hidden="true"></div>
        <h2 id="done-title"></h2>
        <p id="done-subject" class="muted"></p>
        <div class="result-score">
          <span id="done-percent"></span>
          <span id="done-score" class="muted"></span>
        </div>
        <div class="progress progress-lg"><div id="done-progress" class="progress-bar"></div></div>
      </div>
      <div class="card-list">
        <button id="btn-retry" class="btn btn-primary btn-lg">Ulang latihan</button>
        <button id="btn-subjects" class="btn btn-outline btn-lg">Pilih subjek lain</button>
        <button id="btn-home" class="btn btn-ghost btn-lg">Halaman utama</button>
      </div>
    </section>

  </main>

  <script src="js/progress.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
